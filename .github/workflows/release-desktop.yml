name: Compilar y Publicar Ejecutable de Escritorio (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la versión (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows-executable:
    name: Compilar SAD Escritorio (Windows x64)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: |
            backend/package.json
            frontend/package.json
            desktop/package.json

      # 1. Compilación del Backend
      - name: 📦 Instalar dependencias y compilar Backend
        run: |
          cd backend
          npm install
          npx prisma generate
          npm run build
        env:
          CI: false

      # 2. Compilación del Frontend (Next.js Standalone)
      - name: 🌐 Instalar dependencias y compilar Frontend
        run: |
          cd frontend
          npm install
          npm run build
          # Copiar assets estáticos requeridos por el servidor standalone
          Copy-Item -Recurse -Force ".next/static" ".next/standalone/.next/static"
          if (Test-Path "public") {
            Copy-Item -Recurse -Force "public" ".next/standalone/public"
          }
        env:
          CI: false
          NEXT_TELEMETRY_DISABLED: 1

      # 3. Compilación de la Aplicación de Escritorio con Electron Builder
      - name: 🖥️ Compilar Aplicación de Escritorio (.exe)
        run: |
          cd desktop
          npm install
          npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Publicar artefactos compilados en GitHub Releases
      - name: 🚀 Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: Sistema Integrado de Archivos Digitales (SAD) - ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            desktop/dist-installer/*.exe
            desktop/dist-installer/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
